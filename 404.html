<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page Not Found</title>
    <meta http-equiv="refresh" content="3;url=/" />
    <script type="text/javascript">
      var pathname = window.location.pathname;
      if (!pathname.includes("/forestkids")) {
        window.location.href = "/forestkids" + pathname;
      } else {
        window.location.href = "/forestkids";
      }
    </script>
  </head>
  <body>

    <p>Redirecting to homepage...</p>
  </body>
</html>
